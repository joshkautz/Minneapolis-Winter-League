# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

# Reference
# https://github.com/marketplace/actions/deploy-to-firebase-hosting

name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  App:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format App
        working-directory: ./App
        run: npm run format:check

      - name: Lint App
        working-directory: ./App
        run: npm run lint:check

      - name: Typecheck App
        working-directory: ./App
        run: npm run typecheck

      - name: Test App
        working-directory: ./App
        run: npm run test

      - name: Build App
        working-directory: ./App
        run: npm run build

      - name: Deploy to Firebase Hosting Live Channel
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINNESOTA_WINTER_LEAGUE }}
        run: |
          # Install Firebase Tools
          npm install -g firebase-tools

          echo "$GCP_SA_KEY" > /opt/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/opt/gcp_key.json

          # Deploy to Firebase Functions
          firebase deploy --only hosting

  Functions:
    name: Deploy to Firebase Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format Functions
        working-directory: ./Functions
        run: npm run format:check

      - name: Lint Functions
        working-directory: ./Functions
        run: npm run lint:check

      - name: Typecheck Functions
        working-directory: ./Functions
        run: npm run typecheck

      - name: Build Functions
        working-directory: ./Functions
        run: npm run build

      # The steps above build against the workspace install at the repo root.
      # `firebase deploy` does not: its predeploy hook in firebase.json runs
      # `npm install --prefix Functions`, which resolves against
      # Functions/package-lock.json instead. Those two lockfiles can drift,
      # and when they do the deploy fails after CI has already gone green —
      # which is exactly how a stale stripe pin broke a production deploy.
      # Running the real predeploy here keeps them honest.
      - name: Build Functions the way firebase deploy does
        run: |
          rm -rf Functions/node_modules
          npm install --prefix Functions
          npm run build --prefix Functions

      - name: Deploy to Firebase Functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINNESOTA_WINTER_LEAGUE }}
        run: |
          # Install Firebase Tools
          npm install -g firebase-tools

          echo "$GCP_SA_KEY" > /opt/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/opt/gcp_key.json

          # --force is required to deploy a trigger that is newly retried on
          # failure; the CLI refuses it non-interactively otherwise. It also
          # approves deleting functions missing from the source and changing
          # a function's trigger type, so the guard below fails the job if
          # this deploy would do either. See scripts/ci/check-functions-deploy.js.
          # The listing is redirected to a file, so print it when the command
          # fails; otherwise the job dies with nothing but an exit code.
          if ! firebase functions:list --json > /tmp/deployed-functions.json; then
            cat /tmp/deployed-functions.json
            exit 1
          fi
          node scripts/ci/check-functions-deploy.js /tmp/deployed-functions.json

          firebase deploy --only functions --force

  Rules:
    name: Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The Firestore emulator needs a JDK, and firebase-tools 15 refuses
      # anything below 21 — older than the runner image's default.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # firestore.rules is the only thing standing between a client and the
      # database, and it is not covered by the App or Functions test suites.
      - name: Test Firestore rules
        run: npm run test:rules

      # Runs the real Functions source against the emulator. Covers what
      # mocked-Firestore unit tests cannot: actual document paths,
      # transaction atomicity across the denormalized player/team
      # relationship, and collection-group reads.
      - name: Integration tests against the emulator
        run: npm run test:integration

  # firestore.rules and firestore.indexes.json were previously deployed only
  # by hand. A rules change merged to main did not reach production until
  # someone remembered to run `firebase deploy --only firestore`, and an
  # index a query depends on could be missing in production while every
  # local check passed — the emulator does not enforce indexes.
  #
  # Gated on the rules test suite, so a change that opens a write cannot
  # deploy.
  Firestore:
    name: Deploy Firestore Rules and Indexes
    needs: Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Firestore rules and indexes
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINNESOTA_WINTER_LEAGUE }}
        run: |
          npm install -g firebase-tools

          echo "$GCP_SA_KEY" > /opt/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/opt/gcp_key.json

          firebase deploy --only firestore
